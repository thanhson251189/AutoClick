[package]
name = "automatic-mouse-keyboard"
version = "0.3.0"
edition = "2021"
description = "Record/play mouse and keyboard, Smart Click image search, script flow (EN/VI)"
license = "MIT"

[dependencies]
eframe = "=0.26.2"
egui = "=0.26.2"
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"
enigo = "=0.2.1"
rdev = "=0.5.3"
chrono = { version = "=0.4.38", default-features = false, features = ["clock", "std"] }
uuid = { version = "=1.8.0", features = ["v4"] }

[profile.release]
lto = false
codegen-units = 16
opt-level = 2
